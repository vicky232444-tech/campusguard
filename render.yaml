services:
  - type: web
    name: campusguard
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:../db/custom.db
      - key: INTERNAL_SECRET
        value: campusguard-demo-secret
